version: "2"
sql:
  - engine: "postgresql"
    # sqlc understands golang-migrate naming: reads *.up.sql, ignores *.down.sql.
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "sqlcdb"
        out: "internal/platform/database/sqlcdb"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "snake"
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
