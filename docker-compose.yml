services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: insightiq-postgres
    environment:
      POSTGRES_USER: insightiq
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: insightiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightiq -d insightiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: insightiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
